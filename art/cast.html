<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrator Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
<style>
  body{margin:0;background:#ecebe6;font-family:Nunito,system-ui,sans-serif;color:#222}
  h1{font-size:22px;margin:16px 16px 0}
  p.note{margin:4px 16px 0;color:#555}
  .row{margin:16px;background:#fff;border-radius:10px;overflow:hidden}
  .row h2{font-size:18px;margin:0;padding:10px 14px;border-bottom:1px solid #e4e2dc}
  .row .poses{display:grid;grid-template-columns:repeat(3,1fr)}
  svg{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
  .poses svg+svg{border-left:1px solid #f0eee8}
</style>
<h1>Bốn kiểu người dẫn (chọn một)</h1>
<p class="note">Mỗi hàng: đứng nói · chỉ tay · cận mặt câu đùa khô. Tất cả là thiết kế riêng của kênh.</p>
<div id="g"></div>
<script src="cast.js"></script>
<script>
const {D, person} = CAST;
const fr = s => `<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" fill="#fff"/>${s}</svg>`;
document.getElementById("g").innerHTML = Object.entries(D).map(([k,d]) => `<section class="row"><h2>${d.name}</h2><div class="poses">
  ${fr(person(d,{x:640,y:700,s:1.2,pose:"present",f:{eye:"dot",brow:"up",mouth:"talk"}}))}
  ${fr(person(d,{x:640,y:700,s:1.2,pose:"point",f:{eye:"closed",brow:"up",mouth:"talk"}}))}
  ${fr(person(d,{x:640,y:1330,s:2.1,pose:"relax",f:{eye:"half",brow:"skeptic",mouth:"smirk"}}))}
</div></section>`).join("");
</script>
