<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Sample</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@600;800&display=swap">
<style>
  body{margin:0;background:#e9e7e1;font-family:Nunito,system-ui,sans-serif}
  .grid{display:grid;grid-template-columns:repeat(2,640px);gap:16px;padding:16px}
  figure{margin:0;background:#fff}
  svg{display:block;width:640px;height:360px}
  figcaption{padding:8px 12px;font-size:14px;color:#333}
</style>
<div class="grid" id="g"></div>
<script src="kit.js"></script>
<script>
const A=ART, F=A.frame, B=A.bg;
const field2 = B.field()
  + A.caveman({x:330,y:820,s:1.05,prop:A.club(176,-262,22,1.1),arm:"out",eye:"dot",m:"flat"})
  + A.caveman({x:930,y:820,s:1.05,flip:true,hair:"#4a2c18",tunic:"#c99a4e",eye:"dot",m:"flat"});
const panels = [
  ["Người dẫn, chỉ tay, đang nói", F(B.white()+A.narrator({x:640,y:690,s:1.12,pose:"point",eye:"closed",brow:"up",m:"talk"}))],
  ["Người dẫn cận mặt, câu đùa khô", F(B.white()+A.narrator({x:820,y:1330,s:2.15,pose:"relax",eye:"half",brow:"skeptic",m:"smirk"}))],
  ["Cảnh: hai người tiền sử, một người nhặt gậy", F(field2)],
  ["Cảnh: gậy dài hơn nữa, rồi một mũi tên từ xa", F(B.field()
     + A.caveman({x:300,y:820,s:1.05,prop:A.bigBranch(176,-262,14,1.25),arm:"out",eye:"wide",m:"o"})
     + A.arrow(820,330,-8,1.3)
     + A.caveman({x:1180,y:700,s:0.45,flip:true,prop:A.bow(-150,-300,0,1),arm:"out",eye:"dot",m:"smile"}))],
  ["TV: người dẫn bình luận cảnh vừa xem", F(B.white()+A.tv(250,110,450,253,field2)+A.narrator({x:1010,y:800,s:1.1,pose:"point",eye:"closed",brow:"up",m:"talk"}))],
  ["Ảnh thật + người dẫn chỉ vào", F(B.white()+A.photo(110,60,560,520,"Macuahuitl","(ảnh hiện vật thật)")+A.narrator({x:1010,y:860,s:1.15,flip:true,pose:"present",eye:"half",brow:"skeptic",m:"flat"}))],
  ["Mục lục mở chương", F(B.white()+A.menu([["club","Club","#bfe9f2"],["spear","Spear","#f9c3ad"],["bow","Bow","#b9c3f7"],["sword","Sword","#c9f1dd"]],1))],
  ["Cảnh: hai người leo núi thấy khối băng (Ötzi)", F(B.snow()+A.hiker({x:300,y:760,s:1,eye:"wide",m:"o"})+A.hiker({x:490,y:780,s:0.95,coat:"#3f7fd9",eye:"wide",m:"o"})+A.iceBlock(930,640,1.3))],
];
document.getElementById("g").innerHTML = panels.map(([c,s])=>`<figure>${s}<figcaption>${c}</figcaption></figure>`).join("");
</script>
